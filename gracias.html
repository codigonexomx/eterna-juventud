<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gracias por escribirnos | Eterna Juventud</title>
    <meta name="robots" content="noindex, follow">
    <link rel="canonical" href="https://cremaeternajuventud.com/gracias.html">
    <link rel="icon" type="image/webp" href="assets/images/logo-icon.webp">
    <link rel="apple-touch-icon" href="assets/images/logo-icon.webp">
    <style>
        :root {
            --color-primary: #b23a70;
            --color-secondary: #35203b;
            --color-text: #4f4652;
            --color-text-light: #7d6f80;
            --color-background: #fdf8fa;
            --color-white: #ffffff;
            --border-soft: 1px solid rgba(178,58,112,0.14);
            --shadow-soft: 0 24px 70px rgba(53,32,59,0.08);
            --font-serif: Georgia, 'Times New Roman', serif;
            --font-sans: Arial, Helvetica, sans-serif;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            min-height: 100vh;
            display: grid;
            place-items: center;
            padding: 2rem;
            background:
                linear-gradient(135deg, rgba(250,238,243,0.92), rgba(255,255,255,0.86)),
                var(--color-background);
            color: var(--color-text);
            font-family: var(--font-sans);
            line-height: 1.7;
        }
        .confirmation {
            width: min(100%, 680px);
            padding: clamp(2.4rem, 6vw, 4.5rem);
            text-align: center;
            background-color: rgba(255,255,255,0.84);
            border: var(--border-soft);
            box-shadow: var(--shadow-soft);
        }
        .brand-logo {
            display: inline-flex;
            flex-direction: column;
            align-items: center;
            margin-bottom: 2.25rem;
            color: var(--color-primary);
            text-decoration: none;
            text-transform: uppercase;
            letter-spacing: 2px;
        }
        .brand-eterna {
            font-family: var(--font-serif);
            font-size: 1.45rem;
            line-height: 1;
        }
        .brand-juventud {
            font-family: var(--font-serif);
            font-size: 1.75rem;
            line-height: 1.1;
            color: var(--color-secondary);
        }
        .kicker {
            margin-bottom: 0.85rem;
            color: var(--color-primary);
            font-size: 0.78rem;
            font-weight: 700;
            letter-spacing: 2px;
            text-transform: uppercase;
        }
        h1 {
            margin-bottom: 1rem;
            color: var(--color-secondary);
            font-family: var(--font-serif);
            font-size: clamp(2.35rem, 8vw, 4.5rem);
            font-weight: 400;
            line-height: 1.05;
        }
        p {
            max-width: 520px;
            margin: 0 auto 2rem;
            color: var(--color-text-light);
            font-size: 1.05rem;
        }
        .actions {
            display: flex;
            justify-content: center;
            gap: 0.9rem;
            flex-wrap: wrap;
        }
        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            min-height: 48px;
            padding: 0.95rem 1.4rem;
            border-radius: 999px;
            border: 1px solid var(--color-primary);
            background-color: var(--color-primary);
            color: var(--color-white);
            font-size: 0.78rem;
            font-weight: 700;
            letter-spacing: 1px;
            text-decoration: none;
            text-transform: uppercase;
        }
        .btn.secondary {
            background-color: var(--color-white);
            color: var(--color-secondary);
            border-color: rgba(53,32,59,0.16);
        }
        @media (max-width: 520px) {
            body { padding: 1rem; }
            .confirmation { padding: 2rem 1.2rem; }
            .actions { display: grid; }
        }
    </style>
</head>
<body>
    <main class="confirmation" aria-labelledby="confirmation-title">
        <a href="index.html" class="brand-logo" aria-label="Eterna Juventud, volver al inicio">
            <span class="brand-eterna">Eterna</span>
            <span class="brand-juventud">Juventud</span>
        </a>
        <p class="kicker">Mensaje recibido</p>
        <h1 id="confirmation-title">Gracias por escribirnos.</h1>
        <p>Tu mensaje ha sido recibido correctamente. Nos pondremos en contacto contigo muy pronto.</p>
        <div class="actions">
            <a class="btn" href="index.html">Volver al sitio</a>
            <a class="btn secondary" href="https://wa.me/525584097270" target="_blank" rel="noopener noreferrer">Hablar por WhatsApp</a>
        </div>
    </main>
</body>
</html>
